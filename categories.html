<title>Ozon 全类目佣金表 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#005bff;--blue2:#0041cc;--blue-l:#e8f0ff;

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;min-height:100vh}
.hd{background:linear-gradient(90deg,#0a1f5c 0%,#005bff 100%);color:#fff;height:42px;display:flex;align-items:center;padding:0 16px;gap:10px}
.hd-logo{background:rgba(255,255,255,.15);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;letter-spacing:-1px;border:1px solid rgba(255,255,255,.25)}
.hd h1{font-size:13px;font-weight:700}
.hd-badge{margin-left:auto;background:rgba(255,105,0,.8);border-radius:10px;padding:2px 10px;font-size:11px;font-weight:600}
.hd-back{color:#fff;text-decoration:none;font-size:12px;opacity:.8;margin-left:12px}
.hd-back:hover{opacity:1;text-decoration:underline}
.search-bar{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:10}
.search-bar input{width:100%;height:34px;padding:0 12px;font-size:13px;border:1.5px solid var(--b1);border-radius:6px;outline:none;background:var(--bg)}
.search-bar input:focus{border-color:var(--blue);background:#fff}
.search-bar .hint{font-size:11px;color:var(--t4);margin-top:6px}
.filter-row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.filter-label{font-size:11px;color:var(--t3);font-weight:600}
.filter-btn{padding:3px 10px;border:1.5px solid var(--b1);border-radius:14px;background:var(--bg);cursor:pointer;font-size:11px;font-weight:600;color:var(--t3);transition:all .15s}
.filter-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.filter-btn.active{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.filter-btn.low.active{background:var(--green-l);color:var(--green);border-color:var(--green)}
.filter-btn.mid.active{background:var(--orange-l);color:var(--orange);border-color:var(--orange)}
.filter-btn.high.active{background:var(--red-l);color:var(--red);border-color:var(--red)}
.comm-low{color:var(--green)!important}
.comm-mid{color:var(--orange)!important}
.comm-high{color:var(--red)!important}
.cat-block-hd .range-badge{font-size:10px;padding:1px 8px;border-radius:10px;font-weight:600;margin-right:4px}
.range-low{background:var(--green-l);color:var(--green)}
.range-mid{background:var(--orange-l);color:var(--orange)}
.range-high{background:var(--red-l);color:var(--red)}
.stats{padding:8px 16px;font-size:11px;color:var(--t3);background:var(--card);border-bottom:1px solid var(--b1)}
.container{max-width:960px;margin:0 auto;padding:12px 16px}
.cat-block{background:var(--card);border:1px solid var(--b1);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.cat-block-hd{padding:8px 12px;font-size:13px;font-weight:700;color:var(--t1);background:var(--bg);border-bottom:1px solid var(--b2);cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat-block-hd .arrow{margin-left:auto;font-size:10px;transition:transform .2s}
.cat-block-hd.open .arrow{transform:rotate(90deg)}
.cat-block-hd .cn{font-size:12px;color:var(--blue);font-weight:400;margin-left:4px}
.cat-block-hd .comm-badge{font-size:10px;background:var(--orange-l);color:var(--orange);padding:1px 8px;border-radius:10px;font-weight:600;margin-left:auto;margin-right:24px}
.cat-body{display:none}
.cat-body.open{display:block}
.cat-item{display:flex;align-items:center;padding:6px 12px 6px 28px;border-bottom:1px solid var(--b2);font-size:12px;gap:8px;cursor:pointer;transition:background .12s}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{background:var(--blue-l)}
.cat-item .ru{color:var(--t2);flex:1;min-width:0}
.cat-item .cn{color:var(--t3);flex:0 0 auto;font-size:11px}
.cat-item .fbo{color:var(--blue);font-weight:600;flex:0 0 60px;text-align:right}
.cat-item .fbs{color:var(--orange);font-weight:600;flex:0 0 60px;text-align:right}
.cat-item .rfbs{color:var(--green);font-weight:600;flex:0 0 60px;text-align:right}
.cat-header{display:flex;align-items:center;padding:4px 12px 4px 28px;font-size:10px;color:var(--t4);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--b1);background:var(--b2)}
.cat-header span{flex:0 0 60px;text-align:right}
.cat-header span:first-child{flex:1;text-align:left}
.highlight{background:yellow;font-weight:700}
.no-result{text-align:center;padding:40px;color:var(--t4);font-size:14px}
@media(max-width:600px){.cat-item{flex-wrap:wrap;gap:4px}.cat-item .fbo,.cat-item .fbs,.cat-item .rfbs{flex:0 0 auto;font-size:11px}}

const commClass = v => v <= 10 ? 'comm-low' : v <= 20 ? 'comm-mid' : 'comm-high'
const rangeClass = v => v <= 10 ? 'range-low' : v <= 20 ? 'range-mid' : 'range-high'

const matchFilter = (item, filter) => {
  if (filter === 'all') return true
  if (filter === 'low') return item.fbo <= 10
  if (filter === 'mid') return item.fbo > 10 && item.fbo <= 20
  if (filter === 'high') return item.fbo > 20
  return true
}

const getBlockRange = items => {
  let min = Infinity, max = -Infinity
  items.forEach(it => { if (it.fbo < min) min = it.fbo; if (it.fbo > max) max = it.fbo })
  return { min, max }
}

      if (keyword && !searchStr.includes(keyword.toLowerCase())) return
      if (!matchFilter(item, filter)) return
      blockMatched++
      matchedItems++

      const ruText = keyword ? highlightText(item.ru, keyword) : item.ru
      const cnText = keyword ? highlightText(item.cn, keyword) : item.cn

      itemsHtml += '<div class="cat-item" onclick="goCalc(' + item.fbo + ')" title="点击使用 FBO ' + item.fbo + '% 佣金率跳转利润计算器">'
        + '<span class="ru">' + ruText + '</span>'
        + '<span class="cn">' + cnText + '</span>'
        + '<span class="fbo ' + commClass(item.fbo) + '">' + item.fbo + '%</span>'
        + '<span class="fbs ' + commClass(item.fbs) + '">' + item.fbs + '%</span>'
        + '<span class="rfbs ' + commClass(item.rfbs) + '">' + item.rfbs + '%</span>'
        + '</div>'
    })

    if ((keyword || filter !== 'all') && blockMatched === 0) return

    const blockRu = keyword ? highlightText(block.block, keyword) : block.block
    const blockCn = keyword ? highlightText(block.blockCn, keyword) : block.blockCn
    const isOpen = !!(keyword || filter !== 'all')
    const range = getBlockRange(block.items)
    const rangeStr = range.min === range.max ? range.min + '%' : range.min + '~' + range.max + '%'

    html += '<div class="cat-block">'
      + '<div class="cat-block-hd' + (isOpen ? ' open' : '') + '" onclick="toggleBlock(this)">'
      + '<span>' + blockRu + '</span>'
      + '<span class="cn">' + blockCn + '</span>'
      + '<span class="range-badge ' + rangeClass(range.min) + '">FBO ' + rangeStr + '</span>'
      + '<span class="comm-badge">' + blockMatched + ' 项</span>'
      + '<span class="arrow">▶</span>'
      + '</div>'
      + '<div class="cat-body' + (isOpen ? ' open' : '') + '">'
      + '<div class="cat-header"><span>类目名称</span><span>FBO</span><span>FBS</span><span>rFBS</span></div>'
      + itemsHtml
      + '</div>'
      + '</div>'
  })

  if (matchedItems === 0) {
    html = '<div class="no-result">未找到匹配的类目</div>'
  }

  container.innerHTML = html
  document.getElementById('statsBar').textContent =
    '共 ' + data.length + ' 个大类 · ' + totalItems + ' 个子类目'
    + ((keyword || filter !== 'all') ? ' · 当前匹配 ' + matchedItems + ' 项' : '')
}

const highlightText = (text, keyword) => {
  if (!keyword) return text
  const re = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi')
  return text.replace(re, '<span class="highlight">$1</span>')
}

const toggleBlock = el => {
  el.classList.toggle('open')
  const body = el.nextElementSibling
  body.classList.toggle('open')
}

const setFilter = (filter, btn) => {
  currentFilter = filter
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  filterCategories()
}

const filterCategories = () => {
  const keyword = document.getElementById('searchInput').value.trim()
  renderCategories(CATEGORIES, keyword, currentFilter)
}

const goCalc = rate => {
  window.location.href = 'index.html?comm=' + rate
}

renderCategories(CATEGORIES, '', 'all')
</script>
</body>
</html>
